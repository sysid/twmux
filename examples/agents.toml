# twmux watch — agent classification config.
#
# Copy this file to ~/.config/twmux/agents.toml and tune the regexes to
# match the TUIs of the agents you actually run.
#
# How it works:
#   - cmd_match    : regex on the pane's current command (libtmux
#                    pane_current_command). Useful for agents whose command
#                    name is stable.
#   - title_match  : regex on the pane's title (libtmux pane_title). Useful
#                    for agents like Claude Code whose command name is a
#                    version string but whose title is set via OSC sequences.
#                    An agent matches if EITHER cmd_match OR title_match hits.
#   - content_match: regex on the captured pane text. When set, the pane must
#                    ALSO match this pattern (AND logic with cmd/title). Use
#                    when cmd_match is too broad (e.g. "node" catches any
#                    node process, but only Copilot has its distinctive footer).
#   - re_wait      : pane is BLOCKING on user input (permission prompt).
#                    Highest priority; rows in this state float to the top.
#   - re_working   : pane is actively processing.
#   - re_idle      : pane is at its prompt with nothing to do.
#
# Precedence when multiple state regexes match: wait > working > idle.
# Each state regex is applied with re.MULTILINE (anchors are per-line).

poll_interval = 2.0   # seconds between polls

[codex_cli]
# Codex's npm launcher reports pane_current_command = "node", so give Codex a
# stable app-name in its terminal title instead of matching every node process:
#   [tui]
#   terminal_title = ["spinner", "app-name", "project"]
# Keep Codex before Claude: both use a braille working spinner, and matching is
# first-wins. The app-name suffix keeps the Codex title collision-free.
title_match = "^(?:[⠀-⣿] )?codex [|] "
# Numbered choices replace the normal prompt when Codex needs user input.
# Wait is checked before idle, so "› 1." cannot be misclassified as idle.
re_wait     = "^› [1-9]\\."
# Active status lines end with an interrupt hint inside parentheses. Anchoring
# the whole line avoids matching the same words in normal conversation text.
re_working  = "^• .+\\(.*esc to interrupt\\)$"
re_idle     = "^› "

[claude_code]
# Claude Code's pane_current_command is its version (e.g. "2.1.139") — not
# useful as a matcher. The title starts with "✳ " when idle, and with a
# braille-block spinner glyph (U+2800–U+28FF, e.g. "⠐ ") while processing.
# Match either so working panes show up in the popup, not just idle ones.
title_match = "^[✳⠀-⣿] "
# Idle: CC's prompt is "❯" followed by a non-breaking space (\xc2\xa0), not
# ASCII 0x20. Just anchor on the glyph at start-of-line — wait state is
# checked first, so "❯ 1." numbered prompts classify as wait, not idle.
re_idle     = "^❯"
# Wait / working: tune by inspecting a live pane with `twmux capture -t <pane_id>`.
# These are best-guess starters and will likely need adjustment per CC version.
re_wait     = "Do you want to proceed|Do you trust|❯ 1\\."
# Two working signals: the legacy "esc to interrupt" hint AND CC's body
# status line — a line beginning with any Dingbats star/sparkle/snowflake
# glyph, then a verb…, then "(<digits>s|<digits>m". The character class
# spans U+2726–U+274B (= ✦…❋) — narrower ranges keep being bitten by
# an unlisted glyph (e.g. ❋ at U+274B in `❋ Skedaddling…`, ✳ at U+2733
# in `✳ Investigating skim…`). The range stops at U+274B so check marks /
# cross marks (U+274C onward) stay excluded. Anchoring on the glyph at
# line-start avoids false positives from plain text that happens to
# contain "… (5s)" — code comments, chat transcripts, doc snippets
# quoted on screen. Newer auto/YOLO mode drops "esc to interrupt"
# entirely, so the spinner-anchored half is what actually fires today.
re_working  = "esc to interrupt|^[✦-❋] .+… ?\\(\\d+[ms]"

[aider]
cmd_match  = "aider"
re_wait    = "^\\? "
re_idle    = "^> "

# Add more agents here following the same pattern. Examples to extend:
#
# [gemini_cli]
# cmd_match  = "gemini"
# re_wait    = "..."
# re_idle    = "..."
#
# [opencode]
# cmd_match  = "opencode"
# re_wait    = "..."
# re_idle    = "..."

[copilot_cli]
# Match on the title Copilot sets ("<task> - GitHub Copilot"), not on
# pane_current_command: tmux reports the foreground process-group leader, which
# is "node" only when Copilot is launched directly. Behind a wrapper (e.g.
# `uv run srti-wrap -c copilot`) it is "uv", and cmd_match = "^node$" silently
# dropped every wrapped Copilot pane from the switcher.
title_match   = "GitHub Copilot$"
# Copilot's footer chrome differs per state, so content_match is the UNION of
# the per-state footers — NOT just the idle one. Gating on only the idle
# footer made working/question panes lose their footer, fail identification,
# and vanish from the switcher.
# ponytail: brittle to Copilot UI-string changes — the title alone is the
# fallback identity if the footers drift again.
content_match = "/ commands · \\? help|Working · .* esc cancel|enter to confirm · esc to cancel"
# Idle: the help footer, shown whenever Copilot sits at its prompt (with or
# without an "update available" banner). More reliable than the ❯ glyph,
# which the update banner suppresses.
re_idle       = "/ commands · \\? help"
# Working: current footer is "◉ Working · <size> esc cancel" (spinner glyph
# varies, so anchor on the stable tail).
re_working    = "Working · .* esc cancel"
# Wait: an ask_user choice box shows this confirm/cancel hint. Checked before
# working, so a question never misreads as working — note the "to": the
# working footer says "esc cancel", the question says "esc to cancel".
re_wait       = "enter to confirm · esc to cancel"
